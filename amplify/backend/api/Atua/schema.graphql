# ---------------- MODELS ----------------
type PaymentMethod
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "owner", identityClaim: "sub" }
      {
        allow: private
        provider: iam
        operations: [create, read, update, delete]
      }
    ]
  ) {
  id: ID!

  # Cognito user's sub.
  # This is used by @auth to ensure the payment method
  # belongs to the currently authenticated user.
  owner: String!
    @index(name: "byPaymentMethodOwner", queryField: "paymentMethodsByOwner")

  # Atua User.id.
  # This lets our backend easily relate the payment method
  # to the existing User model.
  userID: ID!
    @index(name: "byPaymentMethodUser", queryField: "paymentMethodsByUser")

  user: User @belongsTo(fields: ["userID"])

  # TEST or LIVE Paystack
  paystackEnvironment: PaystackEnvironment

  # Payment provider.
  # Currently PAYSTACK.
  provider: String!

  # Paystack reusable authorization.
  #
  # IMPORTANT:
  # This is NOT a card number, CVV or PIN.
  # It is the Paystack authorization token/code that
  # Paystack gives us after a successful reusable card payment.
  authorizationCode: String!

  # Paystack's unique signature for the card authorization.
  #
  # Used to prevent saving the same card multiple times.
  signature: String!

  # Safe card information for displaying in Atua.
  # We NEVER store the full PAN/card number.
  cardType: String
  last4: String
  expMonth: String
  expYear: String

  # Additional Paystack metadata.
  bank: String
  countryCode: String
  channel: String

  # Whether Paystack says this authorization can be reused.
  reusable: Boolean!

  # Email used when the authorization was created.
  #
  # Paystack requires the same email when charging
  # a reusable authorization.
  email: String!

  # Whether this is the user's default card.
  isDefault: Boolean!

  status: PaymentMethodStatus!

  # Set when the user deletes/deactivates the card.
  deactivatedAt: AWSDateTime

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Payout @model @auth(rules: [{ allow: public }]) {
  id: ID!

  courierID: ID! @index(name: "byCourier")

  walletID: ID @index(name: "byWallet")

  # The amount actually sent to the courier bank.
  # Does NOT include Atua fee.
  amount: Float!

  # Atua fee charged for this payout.
  payoutFee: Float

  # Total amount deducted from the courier wallet.
  # = amount + payoutFee
  totalWalletDebit: Float

  status: PayoutStatus

  bankName: String
  accountNumber: String

  # Atua's unique payout reference
  reference: String @index(name: "byPayoutReference")

  # Paystack transfer information
  transferCode: String
  transferID: String

  # Failure / reconciliation
  failureReason: String

  # How the payout operation was initiated
  # MANUAL_SINGLE | MANUAL_ALL | AUTOMATIC
  payoutMethod: String

  # Who/what initiated the payout
  # COURIER_REQUESTED | ADMIN_MANUAL | SYSTEM
  payoutSource: PayoutSource

  # Lifecycle timestamps
  processedAt: AWSDateTime
  paidAt: AWSDateTime
  failedAt: AWSDateTime

  # Timestamp showing that the wallet has already been
  # restored for this failed/reversed payout.
  # Used to prevent duplicate wallet restoration if
  # Paystack/webhook/reconciliation is retried.
  walletRestoredAt: AWSDateTime
}

type Transaction @model @auth(rules: [{ allow: public }]) {
  id: ID!

