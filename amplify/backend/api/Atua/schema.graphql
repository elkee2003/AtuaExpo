# ---------------- WALLET AND PAYMENT STRUCTURE ----------------
# Courier - has one wallet
# Wallet - belongs to courier - has many transactions
# Transaction - belongs to wallet
# Payment - belongs to order + user
# Order - has many payments

# ---------------- PAYSTACK PAYMENT VERIFICATION ----------------

type VerifyAtuaPaymentResult {
  success: Boolean!
  verified: Boolean
  alreadyPaid: Boolean
  message: String!
  orderId: ID
  deliveryVerificationCode: String
  payment: VerifiedPaymentDetails
}

type VerifiedPaymentDetails {
  reference: String
  amount: Float
  currency: String
  status: String
  channel: String
  paidAt: AWSDateTime
}

# ==========================================================
# SAVED PAYMENT METHOD RESPONSES
# ==========================================================

type ChargeAtuaPaymentMethodResult @aws_cognito_user_pools {
  success: Boolean!
  message: String!
  reference: String
  orderId: ID
}

type DeleteSavedPaymentMethodResult @aws_cognito_user_pools {
  success: Boolean!
  message: String!
  paymentMethodId: ID
}

type Mutation {
  verifyAtuaPayment(orderId: ID!, reference: String!): VerifyAtuaPaymentResult
    @function(name: "verifyAtuaPayment-${env}")
  # ==========================================================
  # CHARGE A SAVED PAYSTACK PAYMENT METHOD
  # ==========================================================

  chargeAtuaPaymentMethod(
    orderId: ID!
    paymentMethodId: ID!
  ): ChargeAtuaPaymentMethodResult
    @auth(rules: [{ allow: private, provider: userPools }])
    @function(name: "chargeAtuaPaymentMethod-${env}")

  # ==========================================================
  # DELETE A SAVED PAYSTACK PAYMENT METHOD
  # ==========================================================

  deleteSavedPaymentMethod(
    paymentMethodId: ID!
  ): DeleteSavedPaymentMethodResult
    @auth(rules: [{ allow: private, provider: userPools }])
    @function(name: "deletePaymentMethod-${env}")

  cancelOrder(
    orderID: ID!
    reason: CancellationReason
    reasonNote: String
  ): OrderCancellation
    @auth(rules: [{ allow: private, provider: userPools }])
    @function(name: "cancelOrder-${env}")

  permanentlyDeleteOrder(orderID: ID!): Boolean
    @auth(rules: [{ allow: private, provider: userPools }])
    @function(name: "deleteOrder-${env}")

  reversePayout(input: ReversePayoutInput!): ReversePayoutResponse
    @function(name: "reversePayout-${env}")

  # ==========================================================
  # ADMIN: MAKE PAYOUT TO ONE SPECIFIC COURIER
  # ==========================================================

  adminMakePayout(
    courierID: ID!
    requestedAmount: Float!
  ): ProcessPayoutsResponse @function(name: "processPayouts-${env}")

  # ==========================================================
  # ADMIN: MAKE PAYOUTS TO ALL ELIGIBLE COURIERS
  # ==========================================================

  adminMakeAllPayouts: ProcessPayoutsResponse
    @function(name: "processPayouts-${env}")

  # ==========================================================
  # COURIER: REQUEST PAYOUT
  # ==========================================================
  #
  # Used by the courier app when a courier confirms
  # a payout request.
  #
  # The courier sends:
  #
  #     payoutMethod = BANK_TRANSFER
  #
  # processPayouts recognizes BANK_TRANSFER as the
  # legacy courier-requested payout flow and internally
  # converts it to:
  #
  #     MANUAL_SINGLE
  #     COURIER_REQUESTED
  #
  # This means:
  #
  #     - ₦3,000 minimum applies
  #     - ₦100 payout fee applies
  #     - wallet reservation/debit is handled by backend
  #     - Payout and Transaction are created by backend
  #     - Paystack transfer is initiated by backend
  #
  requestPayout(
    courierID: ID!
    requestedAmount: Float!
    payoutMethod: String!
  ): ProcessPayoutsResponse @function(name: "processPayouts-${env}")
}

# ==========================================================
# PROCESS PAYOUTS RESPONSE
# ==========================================================
#
# processPayouts currently returns an object containing:

# We keep this response generic because the same Lambda
# supports:
#
#   MANUAL_SINGLE
#   MANUAL_ALL
#   AUTOMATIC
type ProcessPayoutsResponse {
  statusCode: Int!
  body: String!
}

# ---------------- PAYOUT REVERSAL ----------------

input ReversePayoutInput {
  payoutID: ID!
  transactionID: ID!
  walletID: ID!
  reference: String!

  # Informational value supplied by the caller.
  # reversePayout does NOT trust this value when restoring
  # the wallet. It reads Transaction.amount from the database.
  restorationAmount: Float

  # Paystack event that caused the reversal.
  # Expected:
  # transfer.failed
  # transfer.reversed
  eventType: String!

  transferCode: String
  transferID: String

  failureReason: String
}

type ReversePayoutResponse {
  success: Boolean!
  payoutID: ID
  transactionID: ID
  walletID: ID

  payoutStatus: PayoutStatus
  transactionStatus: TransactionStatus

  restoredAmount: Float
  alreadyReversed: Boolean

  message: String
}
