# ---------------- ENUMS ----------------
enum PaystackEnvironment {
  TEST
  LIVE
}

enum OrderEnvironment {
  PRODUCTION
  TEST
}

enum PaymentMethodStatus {
  ACTIVE
  INACTIVE
  EXPIRED
  FAILED
}

enum EarningsAllocationStatus {
  NOT_ALLOCATED
  PROCESSING
  ALLOCATED
  FAILED
}

enum FundsStatus {
  HELD
  PARTIALLY_RELEASED
  RELEASED
}

enum OrderPayoutStatus {
  NOT_PAID
  PAID
}

enum OrderPaymentStatus {
  PENDING
  PROCESSING
  PAID
  FAILED
}

enum PaymentStatus {
  PENDING
  PROCESSING
  SUCCESS
  FAILED
}

enum TransactionType {
  CREDIT
  DEBIT
}

enum TransactionStatus {
  PENDING
  COMPLETED
  FAILED
  REVERSED
}

enum PayoutStatus {
  PENDING
  PROCESSING
  PAID
  FAILED
}

enum PayoutSource {
  COURIER_REQUESTED
  ADMIN_MANUAL
  SYSTEM
}

enum OwnerType {
  COURIER
  USER
}

enum OfferStatus {
  ACTIVE
  ACCEPTED
  REJECTED
  CANCELLED
}

enum CourierPreTransferUploadStatus {
  PENDING
  UPLOADING
  COMPLETE
  FAILED
}

enum CourierPostLoadingUploadStatus {
  PENDING
  UPLOADING
  COMPLETE
  FAILED
}

enum DropoffUploadStatus {
  PENDING
  UPLOADING
  COMPLETE
  FAILED
}

enum MediaUploadStatus {
  PENDING
  UPLOADING
  COMPLETE
  FAILED
}

enum RefundStatus {
  NONE
  PENDING
  PROCESSING
  NEEDS_ATTENTION
  PROCESSED
  FAILED
}

enum CancellationStage {
  BEFORE_ACCEPTANCE
  ACCEPTED
  COURIER_ARRIVED
  PICKUP_STARTED
  PICKED_UP
  IN_TRANSIT
  DELIVERED
}

enum CancellationReason {
  CHANGED_MIND
  WRONG_ADDRESS
  WRONG_ORDER
  TOO_EXPENSIVE
  TOO_LONG_TO_WAIT
  NO_LONGER_NEEDED
  COURIER_DELAY
  COURIER_REQUEST
  SYSTEM_ERROR
  OTHER
}

enum CancellationStatus {
  NONE
  REQUESTED
  PROCESSING
  COMPLETED
  FAILED
  REJECTED
}

enum OrderStatus {
  BIDDING
  AWAITING_PAYMENT
  READY_FOR_PICKUP
  ACCEPTED
  ARRIVED_PICKUP
  LOADING
  PICKED_UP
  IN_TRANSIT
  ARRIVED_DROPOFF
  UNLOADING
  DELIVERED
  HANDOVER_TO_LOGISTICS
  IN_LOGISTICS_TRANSIT
  CANCELLED
  DISPUTED
}

enum CourierReportStatus {
  OPEN
  UNDER_REVIEW
  RESOLVED
  DISMISSED
}

# ---------------- MODELS ----------------
type PaymentMethod
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "owner", identityClaim: "sub" }
      {
        allow: private
        provider: iam
        operations: [create, read, update, delete]
      }
    ]
  ) {
  id: ID!

  # Cognito user's sub.
  # This is used by @auth to ensure the payment method
  # belongs to the currently authenticated user.
  owner: String!
    @index(name: "byPaymentMethodOwner", queryField: "paymentMethodsByOwner")

  # Atua User.id.
  # This lets our backend easily relate the payment method
  # to the existing User model.
  userID: ID!
    @index(name: "byPaymentMethodUser", queryField: "paymentMethodsByUser")

  # TEST or LIVE Paystack
  paystackEnvironment: PaystackEnvironment

  # Payment provider.
  # Currently PAYSTACK.
  provider: String!

  # Paystack reusable authorization.
  #
  # IMPORTANT:
  # This is NOT a card number, CVV or PIN.
  # It is the Paystack authorization token/code that
  # Paystack gives us after a successful reusable card payment.
  authorizationCode: String!

  # Paystack's unique signature for the card authorization.
  #
  # Used to prevent saving the same card multiple times.
  signature: String!

  # Safe card information for displaying in Atua.
  # We NEVER store the full PAN/card number.
  cardType: String
  last4: String
  expMonth: String
  expYear: String

  # Additional Paystack metadata.
  bank: String
  countryCode: String
  channel: String

  # Whether Paystack says this authorization can be reused.
  reusable: Boolean!

  # Email used when the authorization was created.
  #
  # Paystack requires the same email when charging
  # a reusable authorization.
  email: String!

  # Whether this is the user's default card.
  isDefault: Boolean!

  status: PaymentMethodStatus!

  # Set when the user deletes/deactivates the card.
  deactivatedAt: AWSDateTime

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Payout @model @auth(rules: [{ allow: public }]) {
  id: ID!

  courierID: ID! @index(name: "byCourier")

  walletID: ID @index(name: "byWallet")

  # The amount actually sent to the courier's bank account.
  # This does NOT include the Atua payout fee.
  amount: Float!

  # Atua's fee charged for processing this payout.
  # For COURIER_REQUESTED payouts, the fee is tiered by the requested payout amount.
  # For ADMIN_MANUAL and SYSTEM payouts, the fee is ₦100.
  payoutFee: Float!

  # The total amount deducted from the courier's wallet.
  # Formula: amount + payoutFee
  totalWalletDebit: Float!

  status: PayoutStatus

  bankName: String
  accountNumber: String

  # Atua's unique payout reference
  reference: String @index(name: "byPayoutReference")

  # Paystack transfer information
  transferCode: String
  transferID: String

  # Failure / reconciliation
  failureReason: String

  # How the payout operation was initiated
  # MANUAL_SINGLE | MANUAL_ALL | AUTOMATIC
  payoutMethod: String

  # Who/what initiated the payout
  # COURIER_REQUESTED | ADMIN_MANUAL | SYSTEM
  payoutSource: PayoutSource

  # Lifecycle timestamps
  processedAt: AWSDateTime
  paidAt: AWSDateTime
  failedAt: AWSDateTime

  # Timestamp showing that the wallet has already been
  # restored for this failed/reversed payout.
  # Used to prevent duplicate wallet restoration if
  # Paystack/webhook/reconciliation is retried.
  walletRestoredAt: AWSDateTime
}

type Transaction @model @auth(rules: [{ allow: public }]) {
  id: ID!

  walletID: ID! @index(name: "byWallet")

  type: TransactionType
  # CREDIT | DEBIT
  amount: Float!

  description: String

  orderID: ID @index(name: "byOrder")
  paymentID: ID @index(name: "byPayment")

  payoutID: ID @index(name: "byPayout")

  reference: String
    @index(
      name: "byTransactionReference"
      queryField: "transactionsByReference"
    )

  status: TransactionStatus # PENDING | COMPLETED
}

type Wallet @model @auth(rules: [{ allow: public }]) {
  id: ID!

  ownerID: ID!
  ownerType: OwnerType!

  # Money currently available to the courier for payout
  availableBalance: Float

  # Money earned but still being held/restricted
