type AdminAlert @model @auth(rules: [{ allow: public }]) {
  id: ID!

  # --------------------------------------------------------
  # BASIC ALERT INFORMATION
  # --------------------------------------------------------

  # Examples:
  # PAYOUT
  # ORDER
  # COURIER
  # PAYMENT
  # SYSTEM
  type: String!

  # "Automatic Payout Not Started"
  # "Automatic Payout Completed"
  # "Payout Transfer Failed"
  # "Courier Approval Backlog"
  title: String!

  # Main descriptive message shown to the admin.
  message: String!

  # --------------------------------------------------------
  # ALERT SEVERITY
  # --------------------------------------------------------

  # Examples:
  # CRITICAL
  # WARNING
  # INFO
  # SUCCESS
  severity: String!

  # --------------------------------------------------------
  # ALERT LIFECYCLE
  # --------------------------------------------------------

  # Examples:
  # UNREAD
  # READ
  # RESOLVED
  # DISMISSED
  status: String!

  # --------------------------------------------------------
  # PAYOUT INFORMATION
  # --------------------------------------------------------

  # Links this alert to a specific payout when applicable.
  payoutID: ID

  # Examples:
  # MANUAL_SINGLE
  # MANUAL_ALL
  # AUTOMATIC
  payoutMethod: String

  # COURIER_REQUESTED | ADMIN_MANUAL | SYSTEM
  payoutSource: PayoutSource

  # --------------------------------------------------------
  # COURIER INFORMATION
  # --------------------------------------------------------

  # Used when the alert relates to one specific courier.
  courierID: ID

  # --------------------------------------------------------
  # FINANCIAL INFORMATION
  # --------------------------------------------------------

  # General amount associated with the alert.
  #
  # Example:
  # A failed single courier payout of ₦15,000.
  amount: Float

  # Total amount all eligible couriers are owed
  # during an automatic payout run.
  courierObligations: Float

  # Total Paystack transfer fees + stamp duty
  # expected for the automatic payout run.
  paystackCosts: Float

  # Total amount that Atua must have available
  # in Paystack before automatic payout can begin.
  totalRequired: Float

  # Atua's Paystack balance at the time of preflight.
  paystackBalance: Float

  # Exact amount required to top up Paystack.
  topUpRequired: Float

  # Number of couriers affected by the event.
  affectedCourierCount: Int

  # --------------------------------------------------------
  # TIMESTAMPS
  # --------------------------------------------------------

  # When the alert was created.
  createdAt: AWSDateTime!

  # When an admin opened/read the alert.
  readAt: AWSDateTime

  # When the underlying issue/event was resolved.
  resolvedAt: AWSDateTime
}

