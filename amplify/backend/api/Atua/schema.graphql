    rules: [
      { allow: owner, ownerField: "userID", identityClaim: "sub" }
      {
        allow: private
        provider: iam
        operations: [create, read, update, delete]
      }
    ]
  ) {
  id: ID!

  orderID: ID! @index(name: "byOrder")

  userID: ID!

  courierID: ID

  status: CancellationStatus!

  stage: CancellationStage!

  reason: CancellationReason
  reasonNote: String

  originalAmount: Float!
  cancellationFee: Float!
  refundAmount: Float!

  refundStatus: RefundStatus!
  refundReference: String
  paymentReference: String @index(name: "byPaymentReference")

  cancellationRequestedAt: AWSDateTime!
  cancellationProcessedAt: AWSDateTime
  refundRequestedAt: AWSDateTime
  refundedAt: AWSDateTime

  courierReversed: Boolean!
  courierEarningsReversed: Boolean!
  walletReversed: Boolean!
  assignmentReversed: Boolean!

  errorMessage: String

  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

